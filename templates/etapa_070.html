{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="mb-3">
        <a href="/oc/{{ oc.id }}" class="btn btn-outline-secondary btn-sm">← Voltar</a>
    </div>
    <h2 class="mb-1">ETAPA 070 — BALANÇA INICIAL</h2>
    <p><strong>OC:</strong> {{ oc.numero_oc }}</p>
    <hr>
{% include '_contexto.html' %}

    {% if mensagem %}
    <div class="alert alert-danger">{{ mensagem }}</div>
    {% endif %}

    <form method="POST">

        <div class="mb-4">
            <label class="form-label fw-bold">Pesagem (kg)</label>
            <input type="number" name="pesagem" class="form-control"
                   step="0.01" min="0" placeholder="Ex: 12500.00" required>
            <small class="text-muted">Informe o peso bruto do veículo vazio.</small>
        </div>

        <button type="submit" class="btn btn-success">
            Salvar e Finalizar
        </button>
        <a href="/oc/{{ oc.id }}" class="btn btn-secondary">Voltar</a>

    </form>

</div>

{% endblock %}
