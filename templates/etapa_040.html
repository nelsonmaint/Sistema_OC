<div class="mb-3">

<br>
<button type="button" class="btn btn-warning btn-sm mt-2"
onclick="limparCanvas('canvas1')">
Limpar
</button>

<div class="mb-3">
<label>Assinatura do Faturamento</label><br>
<canvas id="canvas2" width="450" height="160"
style="border:1px solid #000;"></canvas>

<input type="hidden" name="assinatura_faturamento" id="assinatura_faturamento">

<br>
<button type="button" class="btn btn-warning btn-sm mt-2"
onclick="limparCanvas('canvas2')">
Limpar
</button>
</div>

<button type="button" class="btn btn-secondary" onclick="proximo(2)">
Voltar
</button>

<button type="submit" class="btn btn-success"
onclick="return validarFinal()">
Salvar e Finalizar
</button>

<script>

function prepararCanvas(id){

    let canvas = document.getElementById(id);
    let ctx = canvas.getContext('2d');
    let desenhando = false;

    canvas.onmousedown = function(e){
        desenhando = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
    };

    canvas.onmousemove = function(e){
        if(desenhando){
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }
    };

    canvas.onmouseup = function(){
        desenhando = false;
    };

    canvas.onmouseleave = function(){
        desenhando = false;
    };
}

function limparCanvas(id){

    let canvas = document.getElementById(id);
    let ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function salvarAssinaturas(){

    document.getElementById('assinatura_motorista').value =
        document.getElementById('canvas1').toDataURL();

    document.getElementById('assinatura_faturamento').value =
        document.getElementById('canvas2').toDataURL();
}

function proximo(num){

    let atual = document.querySelector(
        '#passo1:not([style*="none"]), #passo2:not([style*="none"]), #passo3:not([style*="none"])'
    );

    let campos = atual.querySelectorAll('input, select');

    for(let campo of campos){

        if(campo.hasAttribute('required') && campo.value.trim() === ''){

            alert('Preencha todos os campos obrigatórios antes de avançar.');
            campo.focus();
            return;
        }
    }

    document.getElementById('passo1').style.display = 'none';
    document.getElementById('passo2').style.display = 'none';
    document.getElementById('passo3').style.display = 'none';

    document.getElementById('passo' + num).style.display = 'block';
}

function validarFinal(){

    salvarAssinaturas();

    let assinatura1 =
        document.getElementById('assinatura_motorista').value;

    let assinatura2 =
        document.getElementById('assinatura_faturamento').value;

    if(!assinatura1 || !assinatura2){

        alert('As duas assinaturas são obrigatórias.');
        return false;
    }

    return true;
}

prepararCanvas('canvas1');
prepararCanvas('canvas2');

</script>
